name: Paperback 0.8 build probe
on:
  push:
    paths:
      - "paperback/**"
      - ".github/workflows/paperback-build.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Paperback 0.8 toolchain
        run: npm install --no-audit --no-fund
      - name: TypeScript compilation check
        run: npx tsc --noEmit
      - name: Prepare repository-root source folder
        run: |
          mkdir -p ../src
          cp -R src/. ../src/
          test -f ../src/KolNovel/KolNovel.ts
      - name: Attempt source bundle
        run: |
          set -o pipefail
          npm run bundle 2>&1 | tee ../paperback-bundle.log
          if grep -Eiq 'Error \[|ENOENT|Unable to|Compilation failed' ../paperback-bundle.log; then
            echo "Paperback toolchain logged a build error"
            exit 1
          fi
      - name: List bundle output files
        if: always()
        run: |
          pwd
          find .. -maxdepth 5 -type f -not -path '*/node_modules/*' -not -path '*/.git/*' | sort | head -200
          echo 'Top-level generated directories:'
          ls -la ..
          ls -la .
      - name: Inspect generated outputs including hidden paths
        if: always()
        run: |
          echo 'Changed and untracked files:'
          git status --short --untracked-files=all | head -100
          echo 'Directories excluding dependencies:'
          find .. -maxdepth 5 -type d -not -path '*/node_modules*' -not -path '*/.git*' | sort | head -130
          echo 'Bundle-like files:'
          find .. -type f \( -name '*.js' -o -name '*.json' -o -name '*.html' -o -name '*.pb' \) -not -path '*/node_modules/*' -not -path '*/.git/*' | sort | tail -100
      - name: Verify Paperback repository bundle
        run: |
          test -s bundles/index.html
          test -s bundles/versioning.json
          test -s bundles/KolNovel/source.js
          echo 'Paperback repository bundle verified.'
      - name: Upload bundle for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: paperback/bundles
      - name: Save bundle diagnostics and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolnovel-paperback-build
          path: |
            paperback-bundle.log
            paperback/.dist/
            paperback/dist/
            paperback/build/
            paperback/lib/
            .dist/
            dist/
            build/
            paperback/0.8/
            paperback/repository/
            paperback/public/
            0.8/
            repository/
            public/
            index.html
            paperback/index.html
            paperback/bundles/
          if-no-files-found: warn
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish KolNovel repository
        id: deployment
        uses: actions/deploy-pages@v4
